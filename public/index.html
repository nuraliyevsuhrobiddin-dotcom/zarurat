  <noscript><style>#app{display:none}</style><main id="no-script-main" class="container" style="padding-top:32px;padding-bottom:32px"><h1>ZARURIYAT — Qarshida oilangiz uchun xizmatlar</h1><p>Koordinator murojaatingizni ko‘rib chiqib, siz bilan bog‘lanadi va kerakli mutaxassis yoki hamkor xizmatni topishda ko‘maklashadi.</p><nav aria-label="Xizmat va aloqa ma’lumotlari"><a href="/xizmatlar/">Barcha xizmatlar</a> · <a href="/qanday-ishlaydi/">Qanday ishlaydi</a> · <a href="/aloqa/">Aloqa</a></nav><ul><li><a href="/xizmatlar/huquqiy-yordam/">Huquqiy maslahat</a></li><li><a href="/xizmatlar/psixolog/">Psixologik maslahat</a></li><li><a href="/xizmatlar/tibbiy-mutaxassis/">Shifokorga yo‘naltirish</a></li><li><a href="/xizmatlar/bolalar-uchun-yordam/">Bolalar uchun yordam</a></li><li><a href="/xizmatlar/keksalar-uchun-yordam/">Keksalar uchun yordam</a></li><li><a href="/xizmatlar/ayollar-uchun-yordam/">Ayollar uchun yordam</a></li><li><a href="/xizmatlar/tadbirkorlik-maslahati/">Tadbirkorlik bo‘yicha maslahat</a></li><li><a href="/xizmatlar/bank-kredit-maslahati/">Bank va kredit bo‘yicha maslahat</a></li><li><a href="/xizmatlar/hujjatlar/">Hujjatlar bo‘yicha yordam</a></li><li><a href="/xizmatlar/enaga/">Enaga topish</a></li><li><a href="/xizmatlar/qarovchi/">Qarovchi topish</a></li><li><a href="/xizmatlar/uy-tozalash/">Uy tozalash</a></li><li><a href="/xizmatlar/usta-tamirlash/">Usta va ta’mirlash</a></li><li><a href="/xizmatlar/kerakli-xizmatni-aniqlash/">Kerakli xizmatni aniqlash</a></li></ul><p><strong>Manzil:</strong> Qarshi shahri, Yoshlar texnoparki</p><p><strong>Murojaat qabul qilish:</strong> 24/7</p><p>Koordinatorning bog‘lanish vaqti alohida kelishiladi.</p><p><a href="tel:+998554067755">+998 55 406 77 55</a> · <a href="https://www.google.com/maps/search/?api=1&amp;query=Qarshi%20Yoshlar%20texnoparki" rel="noopener">Xaritada qidirish</a></p></main></noscript>
