services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      SECURE_COOKIE: "true"
      ADMIN_PHONE: ${ADMIN_PHONE:?Set ADMIN_PHONE in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your Vercel site origin}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  app_data:
  caddy_data:
  caddy_config:
